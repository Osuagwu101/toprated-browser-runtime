name: Verified Through Phase 3

on:
  push:
    branches:
      - phase11-security-hardening
      - phase10-multi-tool-one-click-auth
      - verified-through-phase3
      - phase4-ci-baseline-fix
      - phase5-session-isolation
      - phase6-lifecycle-management
      - phase7-tool-profiles
      - phase8-phrasly-reference
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  VIEWER_SIGNING_SECRET: standalone-ci-only-signing-secret-not-for-production-0123456789abcdef
  VIEWER_TOKEN_TTL_SECONDS: 300
  RUNTIME_SERVICE_AUTH_SECRET: standalone-ci-service-auth-secret-not-for-production-0123456789abcdef
  RUNTIME_OPERATOR_AUTH_SECRET: phase9-ci-operator-secret-not-for-production-0123456789abcdef
  WORKER_CONTROL_SECRET: standalone-ci-worker-control-secret-not-for-production-0123456789abcdef
  SERVICE_AUTH_MAX_SKEW_SECONDS: 300
  VIEWER_PUBLIC_BASE_URL: http://127.0.0.1:18081
  MAX_BROWSER_SESSIONS: 3

jobs:
  verified-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository-wide type and syntax gate
        run: bash scripts/typecheck.sh

      - name: Phase 1 - unit gate
        run: node --test browser-worker/test/*.test.mjs

      - name: Phase 3 - static security gates
        run: |
          set -euo pipefail
          grep -F -- "--remote-debugging-address=127.0.0.1" browser-worker/src/browser-session.mjs
          grep -F -- "rawCdpExposed: false" browser-worker/src/health.mjs
          grep -F -- "grantIssuer: 'laravel'" browser-worker/src/health.mjs
          grep -F -- "url-fragment-to-bearer" api/app/Services/ViewerGrantService.php
          grep -F -- "frame-ancestors 'none'" browser-worker/src/server.mjs
          if grep -F "issueViewerGrant" browser-worker/src/server.mjs; then
            echo 'Browser worker unexpectedly issues viewer grants; Laravel must remain the grant issuer.' >&2
            exit 1
          fi
          if grep -R --line-number -E '0\.0\.0\.0:9222|:9222:|remote-debugging-address=0\.0\.0\.0' browser-worker api docker-compose.yml; then
            echo 'Unsafe raw CDP exposure pattern found.' >&2
            exit 1
          fi
          if grep -R --line-number -i 'phrasly' browser-worker/src api/app api/routes api/config/browser.php; then
            echo 'Generic runtime core contains tool-specific Phrasly logic.' >&2
            exit 1
          fi

      - name: Build standalone containers with retry
        run: |
          set -euo pipefail
          delay=10
          for attempt in 1 2 3; do
            echo "compose_build_attempt=${attempt}/3"
            if docker compose build; then
              echo 'compose_build=pass'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'compose_build=fail attempts=3' >&2
              exit 1
            fi
            echo "compose_build_retry_in_seconds=${delay}" >&2
            sleep "$delay"
            delay=$((delay * 2))
          done

      - name: Boot inherited regression runtime without autonomous reaper
        run: docker compose up -d api browser-worker

      - name: Verify localhost-only publication
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null && curl --fail --silent http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 2
          done
          PUBLISHED="$(docker compose port browser-worker 8081)"
          echo "worker_publication=${PUBLISHED}"
          case "$PUBLISHED" in 127.0.0.1:*) ;; *) echo 'browser worker is not localhost-only' >&2; exit 1 ;; esac
          if docker compose port browser-worker 9222 >/tmp/cdp-published.txt 2>/dev/null && test -s /tmp/cdp-published.txt; then
            echo "raw CDP port unexpectedly published: $(cat /tmp/cdp-published.txt)" >&2
            exit 1
          fi

      - name: Phase 1-3 end-to-end regression
        run: node browser-worker/test/standalone-migration.e2e.mjs

      - name: Independent Chromium process cleanup check
        run: |
          docker compose exec -T browser-worker node - <<'NODE'
          const fs = require('node:fs');
          const chromium = [];
          for (const entry of fs.readdirSync('/proc')) {
            if (!/^\d+$/.test(entry)) continue;
            try {
              if (fs.readFileSync(`/proc/${entry}/comm`, 'utf8').trim() === 'chromium') chromium.push(Number(entry));
            } catch {}
          }
          if (chromium.length) {
            console.error(`orphan chromium processes: ${chromium.join(',')}`);
            process.exit(1);
          }
          console.log('chromium_process_scan=clean');
          NODE

      - name: Container status
        run: docker compose ps

      - name: Tear down and verify cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans
          test -z "$(docker compose ps -q)"
