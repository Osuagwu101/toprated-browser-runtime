name: Phase 4 Laravel Session API

on:
  push:
    branches:
      - phase4-laravel-session-api
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  VIEWER_SIGNING_SECRET: phase4-ci-viewer-signing-secret-not-for-production-0123456789abcdef
  VIEWER_TOKEN_TTL_SECONDS: 300
  RUNTIME_SERVICE_AUTH_SECRET: phase4-ci-service-auth-secret-not-for-production-0123456789abcdef
  SERVICE_AUTH_MAX_SKEW_SECONDS: 300
  VIEWER_PUBLIC_BASE_URL: http://127.0.0.1:18081
  MAX_BROWSER_SESSIONS: 1

jobs:
  phase4-session-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static and unit gates
        run: |
          set -euo pipefail
          node --test browser-worker/test/*.test.mjs
          find api -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 -m json.tool api/composer.json >/dev/null
          grep -F "Route::post('/sessions'" api/routes/api.php
          grep -F "Route::post('/sessions/{session}/heartbeat'" api/routes/api.php
          grep -F "Route::post('/sessions/{session}/activity'" api/routes/api.php
          grep -F "Route::delete('/sessions/{session}'" api/routes/api.php
          grep -F "Route::get('/capacity'" api/routes/api.php
          grep -F "service.auth" api/routes/api.php
          grep -F "hash_hmac('sha256'" api/app/Services/ViewerGrantService.php
          grep -F "hash_hmac('sha256'" api/app/Http/Middleware/VerifyServiceRequest.php
          if grep -R --line-number -i 'phrasly' browser-worker/src api/app api/routes api/config; then
            echo 'Phase 4 production runtime contains tool-specific Phrasly logic.' >&2
            exit 1
          fi
          if grep -R --line-number -E '0\.0\.0\.0:9222|:9222:|remote-debugging-address=0\.0\.0\.0' browser-worker api docker-compose.yml; then
            echo 'Unsafe raw CDP exposure pattern found.' >&2
            exit 1
          fi

      - name: Build Phase 4 containers
        run: docker compose build

      - name: Boot Phase 4 runtime
        run: docker compose up -d

      - name: Wait for migrated Phase 4 health
        run: |
          set -euo pipefail
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/tmp/phase4-health.json \
              && curl --fail --silent http://127.0.0.1:18081/health >/tmp/phase4-worker-health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/phase4-health.json
          cat /tmp/phase4-worker-health.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/phase4-health.json'))
          assert h['status']=='ok', h
          assert h['phase']==4, h
          assert h['session_owner']=='laravel', h
          assert h['service_auth']=='hmac-sha256-timestamp-nonce-v1', h
          assert h['database']=='ok', h
          assert h['browser_worker']=='ok', h
          PY

      - name: Preserve Phase 1-3 browser and viewer regression
        run: node browser-worker/test/standalone-migration.e2e.mjs

      - name: Phase 4 signed API ownership and lifecycle regression
        env:
          API_BASE: http://127.0.0.1:18080
          WORKER_BASE: http://127.0.0.1:18081
        run: |
          python3 - <<'PY'
          import base64, hashlib, hmac, json, os, secrets, time
          from urllib import error, parse, request

          api=os.environ['API_BASE']
          worker=os.environ['WORKER_BASE']
          service_secret=os.environ['RUNTIME_SERVICE_AUTH_SECRET'].encode()
          viewer_secret=os.environ['VIEWER_SIGNING_SECRET'].encode()

          def signed(method, path, writer, obj=None, nonce=None, timestamp=None, signature_writer=None):
              body=b'' if obj is None else json.dumps(obj, separators=(',', ':')).encode()
              ts=int(time.time()) if timestamp is None else int(timestamp)
              nonce=nonce or secrets.token_urlsafe(18)
              signed_writer=writer if signature_writer is None else signature_writer
              canonical='\n'.join([
                  method.upper(), path, str(ts), nonce, signed_writer,
                  hashlib.sha256(body).hexdigest(),
              ]).encode()
              signature=hmac.new(service_secret, canonical, hashlib.sha256).hexdigest()
              headers={
                  'accept':'application/json',
                  'x-toprated-timestamp':str(ts),
                  'x-toprated-nonce':nonce,
                  'x-toprated-signature':signature,
                  'x-toprated-writer-id':writer,
              }
              if obj is not None:
                  headers['content-type']='application/json'
              req=request.Request(api+path, data=(body if obj is not None else None), headers=headers, method=method.upper())
              try:
                  with request.urlopen(req, timeout=20) as response:
                      raw=response.read()
                      return response.status, json.loads(raw or b'{}')
              except error.HTTPError as exc:
                  raw=exc.read()
                  return exc.code, json.loads(raw or b'{}')

          # Protected control-plane routes reject unsigned traffic.
          try:
              request.urlopen(api+'/api/capacity', timeout=10)
              raise AssertionError('unsigned capacity request unexpectedly succeeded')
          except error.HTTPError as exc:
              assert exc.code == 401, exc.code

          code, capacity=signed('GET','/api/capacity','writer-a')
          assert code==200, (code,capacity)
          assert capacity['phase']==4
          assert capacity['configuredMaxSessions']==1
          assert capacity['effectiveMaxSessions']==1
          assert capacity['openSessions']==0
          assert capacity['availableSlots']==1
          assert capacity['workerHealthy'] is True
          assert capacity['configurationValid'] is True

          launch='data:text/html,%3Ctitle%3EPhase%204%20Owned%3C/title%3E%3Ch1%3EOwned%3C/h1%3E'
          launch_body={'writer_id':'writer-a','tool_slug':'generic-phase4','launch_url':launch}
          code, created=signed('POST','/api/sessions','writer-a',launch_body)
          assert code==201, (code,created)
          assert created['status']=='active', created
          assert created['writerId']=='writer-a'
          assert created['toolSlug']=='generic-phase4'
          assert created['reused'] is False
          sid=created['sessionId']
          grant=created['viewerGrant']
          assert grant and grant['rawCdpExposed'] is False
          assert grant['tokenTransport']=='url-fragment-to-bearer'

          # Laravel, not the worker response, issued this signed writer-bound viewer grant.
          parts=parse.urlsplit(grant['url'])
          token=parse.unquote(parts.fragment)
          encoded, supplied_sig=token.split('.',1)
          payload=json.loads(base64.urlsafe_b64decode(encoded+'='*((4-len(encoded)%4)%4)))
          expected_sig=base64.urlsafe_b64encode(hmac.new(viewer_secret, encoded.encode(), hashlib.sha256).digest()).decode().rstrip('=')
          assert hmac.compare_digest(supplied_sig, expected_sig)
          assert payload['wid']=='writer-a', payload
          assert payload['sid'] in grant['url'], payload
          assert payload['exp']>payload['iat']

          viewer_url=parse.urlunsplit((parts.scheme,parts.netloc,parts.path,parts.query,''))
          frame_req=request.Request(viewer_url+'/frame', headers={'authorization':'Bearer '+token})
          with request.urlopen(frame_req, timeout=20) as response:
              frame=response.read()
              assert response.status==200
              assert frame[:3]==b'\xff\xd8\xff'
              assert len(frame)>2000

          # Re-launch by the same writer/tool reuses the same live browser and returns a fresh grant.
          code, reused=signed('POST','/api/sessions','writer-a',launch_body)
          assert code==200, (code,reused)
          assert reused['reused'] is True
          assert reused['sessionId']==sid
          assert reused['viewerGrant']['url']!=grant['url']

          # Capacity is occupied and a second writer cannot take or replace the running browser.
          code, capacity=signed('GET','/api/capacity','writer-a')
          assert code==200 and capacity['openSessions']==1 and capacity['availableSlots']==0, capacity
          code, full=signed('POST','/api/sessions','writer-b',{
              'writer_id':'writer-b','tool_slug':'generic-phase4','launch_url':launch,
          })
          assert code==429 and full['code']=='CAPACITY_FULL', (code,full)

          # Ownership checks apply to status, viewer grants and close.
          code, forbidden=signed('GET',f'/api/sessions/{sid}','writer-b')
          assert code==403 and forbidden['code']=='SESSION_FORBIDDEN', (code,forbidden)
          code, forbidden=signed('POST',f'/api/sessions/{sid}/viewer-grant','writer-b',{})
          assert code==403 and forbidden['code']=='SESSION_FORBIDDEN', (code,forbidden)
          code, forbidden=signed('DELETE',f'/api/sessions/{sid}','writer-b')
          assert code==403 and forbidden['code']=='SESSION_FORBIDDEN', (code,forbidden)

          code, heartbeat=signed('POST',f'/api/sessions/{sid}/heartbeat','writer-a',{})
          assert code==200 and heartbeat['lastHeartbeatAt'], (code,heartbeat)
          code, activity=signed('POST',f'/api/sessions/{sid}/activity','writer-a',{})
          assert code==200 and activity['lastActivityAt'], (code,activity)

          code, fresh_grant=signed('POST',f'/api/sessions/{sid}/viewer-grant','writer-a',{})
          assert code==200 and fresh_grant['viewerGrant']['url']!=grant['url'], (code,fresh_grant)

          # The signed writer identity is part of the HMAC canonical form and cannot be swapped.
          code, tampered=signed('GET','/api/capacity','writer-b',signature_writer='writer-a')
          assert code==401 and tampered['code']=='AUTH_INVALID_SIGNATURE', (code,tampered)

          # Replay protection consumes each valid nonce exactly once.
          replay_nonce=secrets.token_urlsafe(18)
          replay_ts=int(time.time())
          code, first=signed('GET','/api/capacity','writer-a',nonce=replay_nonce,timestamp=replay_ts)
          assert code==200, (code,first)
          code, replay=signed('GET','/api/capacity','writer-a',nonce=replay_nonce,timestamp=replay_ts)
          assert code==409 and replay['code']=='AUTH_REPLAY', (code,replay)

          code, closed=signed('DELETE',f'/api/sessions/{sid}','writer-a')
          assert code==200 and closed['status']=='closed', (code,closed)
          assert closed['closedAt'], closed

          # Viewer authorization becomes useless as soon as the worker browser is destroyed.
          try:
              request.urlopen(frame_req, timeout=10)
              raise AssertionError('closed viewer token unexpectedly remained usable')
          except error.HTTPError as exc:
              assert exc.code==410, exc.code

          code, capacity=signed('GET','/api/capacity','writer-a')
          assert code==200 and capacity['openSessions']==0 and capacity['availableSlots']==1, capacity

          open('/tmp/phase4-session-id','w').write(sid)
          print('phase4_signed_api_lifecycle=pass')
          PY

      - name: Verify sensitive launch payload is not persisted in session record
        run: |
          set -euo pipefail
          docker compose exec -T api php -r '
            $db=new PDO("sqlite:/srv/runtime-api/storage/data/database.sqlite");
            $rows=$db->query("select launch_url from browser_sessions")->fetchAll(PDO::FETCH_COLUMN);
            if (!$rows || $rows[0] !== "data:text/html") { fwrite(STDERR, json_encode($rows)); exit(1); }
            echo "stored_launch_url=".$rows[0].PHP_EOL;
          '

      - name: Verify session records survive Laravel container restart
        run: |
          set -euo pipefail
          docker compose restart api
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/api/health >/dev/null; then break; fi
            sleep 2
          done
          python3 - <<'PY'
          import hashlib,hmac,json,os,secrets,time
          from urllib import error,request
          sid=open('/tmp/phase4-session-id').read().strip()
          path=f'/api/sessions/{sid}'
          writer='writer-a'
          ts=int(time.time()); nonce=secrets.token_urlsafe(18); body=b''
          canonical='\n'.join(['GET',path,str(ts),nonce,writer,hashlib.sha256(body).hexdigest()]).encode()
          sig=hmac.new(os.environ['RUNTIME_SERVICE_AUTH_SECRET'].encode(),canonical,hashlib.sha256).hexdigest()
          req=request.Request('http://127.0.0.1:18080'+path,headers={
            'accept':'application/json','x-toprated-timestamp':str(ts),'x-toprated-nonce':nonce,
            'x-toprated-signature':sig,'x-toprated-writer-id':writer,
          })
          with request.urlopen(req,timeout=20) as response:
            data=json.load(response)
          assert data['sessionId']==sid and data['status']=='closed', data
          print('phase4_session_record_restart_persistence=pass')
          PY

      - name: Independent Chromium cleanup scan
        run: |
          docker compose exec -T browser-worker node - <<'NODE'
          const fs = require('node:fs');
          const chromium = [];
          for (const entry of fs.readdirSync('/proc')) {
            if (!/^\d+$/.test(entry)) continue;
            try {
              if (fs.readFileSync(`/proc/${entry}/comm`, 'utf8').trim() === 'chromium') chromium.push(Number(entry));
            } catch {}
          }
          if (chromium.length) {
            console.error(`orphan chromium processes: ${chromium.join(',')}`);
            process.exit(1);
          }
          console.log('chromium_process_scan=clean');
          NODE

      - name: Container status
        run: docker compose ps

      - name: Tear down and verify cleanup
        if: always()
        run: |
          docker compose down -v --remove-orphans
          test -z "$(docker compose ps -q)"
