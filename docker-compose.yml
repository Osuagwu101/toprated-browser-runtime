services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      APP_URL: ${APP_URL:-http://localhost:18080}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: sqlite
      DB_DATABASE: /srv/runtime-api/storage/data/database.sqlite
      BROWSER_WORKER_URL: http://browser-worker:8081
      WORKER_CONTROL_SECRET: ${WORKER_CONTROL_SECRET:?WORKER_CONTROL_SECRET must be set}
      RUNTIME_SERVICE_AUTH_SECRET: ${RUNTIME_SERVICE_AUTH_SECRET:?RUNTIME_SERVICE_AUTH_SECRET must be set}
      RUNTIME_OPERATOR_AUTH_SECRET: ${RUNTIME_OPERATOR_AUTH_SECRET:?RUNTIME_OPERATOR_AUTH_SECRET must be set}
      SERVICE_AUTH_MAX_SKEW_SECONDS: ${SERVICE_AUTH_MAX_SKEW_SECONDS:-300}
      SERVICE_RATE_LIMIT_PER_MINUTE: ${SERVICE_RATE_LIMIT_PER_MINUTE:-600}
      OPERATOR_RATE_LIMIT_PER_MINUTE: ${OPERATOR_RATE_LIMIT_PER_MINUTE:-60}
      RUNTIME_API_MAX_REQUEST_BYTES: ${RUNTIME_API_MAX_REQUEST_BYTES:-327680}
      VIEWER_SIGNING_SECRET: ${VIEWER_SIGNING_SECRET:?VIEWER_SIGNING_SECRET must be set}
      VIEWER_TOKEN_TTL_SECONDS: ${VIEWER_TOKEN_TTL_SECONDS:-300}
      ADMIN_VIEWER_TOKEN_TTL_SECONDS: ${ADMIN_VIEWER_TOKEN_TTL_SECONDS:-900}
      VIEWER_PUBLIC_BASE_URL: ${VIEWER_PUBLIC_BASE_URL:-http://127.0.0.1:18081}
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-3}
      SESSION_LEASE_SECONDS: ${SESSION_LEASE_SECONDS:-5400}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-900}
      SESSION_DISCONNECT_GRACE_SECONDS: ${SESSION_DISCONNECT_GRACE_SECONDS:-180}
      SESSION_STARTUP_GRACE_SECONDS: ${SESSION_STARTUP_GRACE_SECONDS:-150}
      SESSION_REAPER_INTERVAL_SECONDS: ${SESSION_REAPER_INTERVAL_SECONDS:-30}
      BROWSER_STATE_MAX_BYTES: ${BROWSER_STATE_MAX_BYTES:-262144}
      BROWSER_IDENTITY_ENCRYPTION_KEY: ${BROWSER_IDENTITY_ENCRYPTION_KEY:?BROWSER_IDENTITY_ENCRYPTION_KEY must be set}
      ALLOW_LEGACY_BROWSER_STATE_INPUT: ${ALLOW_LEGACY_BROWSER_STATE_INPUT:-false}
      ALLOW_LEGACY_AUTH_RESTORE: ${ALLOW_LEGACY_AUTH_RESTORE:-false}
      BROWSER_NAVIGATION_TIMEOUT_MS: ${BROWSER_NAVIGATION_TIMEOUT_MS:-45000}
      TOOL_PROFILES_PATH: ${TOOL_PROFILES_PATH:-/srv/runtime-api/config/tool-profiles.json}
    ports:
      - "127.0.0.1:${API_PORT:-18080}:8080"
    volumes:
      - runtime-data:/srv/runtime-api/storage/data
    depends_on:
      browser-worker:
        condition: service_healthy
    networks:
      - browser-runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  lifecycle-reaper:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: ["sh", "-lc", "while true; do php artisan browser:sessions:reap; sleep \"$${SESSION_REAPER_INTERVAL_SECONDS}\"; done"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY must be set}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_CONNECTION: sqlite
      DB_DATABASE: /srv/runtime-api/storage/data/database.sqlite
      BROWSER_WORKER_URL: http://browser-worker:8081
      WORKER_CONTROL_SECRET: ${WORKER_CONTROL_SECRET:?WORKER_CONTROL_SECRET must be set}
      RUNTIME_SERVICE_AUTH_SECRET: ${RUNTIME_SERVICE_AUTH_SECRET:?RUNTIME_SERVICE_AUTH_SECRET must be set}
      RUNTIME_OPERATOR_AUTH_SECRET: ${RUNTIME_OPERATOR_AUTH_SECRET:?RUNTIME_OPERATOR_AUTH_SECRET must be set}
      SERVICE_AUTH_MAX_SKEW_SECONDS: ${SERVICE_AUTH_MAX_SKEW_SECONDS:-300}
      VIEWER_SIGNING_SECRET: ${VIEWER_SIGNING_SECRET:?VIEWER_SIGNING_SECRET must be set}
      VIEWER_TOKEN_TTL_SECONDS: ${VIEWER_TOKEN_TTL_SECONDS:-300}
      VIEWER_PUBLIC_BASE_URL: ${VIEWER_PUBLIC_BASE_URL:-http://127.0.0.1:18081}
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-3}
      SESSION_LEASE_SECONDS: ${SESSION_LEASE_SECONDS:-5400}
      SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-900}
      SESSION_DISCONNECT_GRACE_SECONDS: ${SESSION_DISCONNECT_GRACE_SECONDS:-180}
      SESSION_STARTUP_GRACE_SECONDS: ${SESSION_STARTUP_GRACE_SECONDS:-150}
      SESSION_REAPER_INTERVAL_SECONDS: ${SESSION_REAPER_INTERVAL_SECONDS:-30}
      BROWSER_STATE_MAX_BYTES: ${BROWSER_STATE_MAX_BYTES:-262144}
      BROWSER_IDENTITY_ENCRYPTION_KEY: ${BROWSER_IDENTITY_ENCRYPTION_KEY:?BROWSER_IDENTITY_ENCRYPTION_KEY must be set}
      ALLOW_LEGACY_BROWSER_STATE_INPUT: ${ALLOW_LEGACY_BROWSER_STATE_INPUT:-false}
      ALLOW_LEGACY_AUTH_RESTORE: ${ALLOW_LEGACY_AUTH_RESTORE:-false}
      TOOL_PROFILES_PATH: ${TOOL_PROFILES_PATH:-/srv/runtime-api/config/tool-profiles.json}
    volumes:
      - runtime-data:/srv/runtime-api/storage/data
    depends_on:
      api:
        condition: service_healthy
      browser-worker:
        condition: service_healthy
    networks:
      - browser-runtime
    restart: unless-stopped

  browser-worker:
    build:
      context: .
      dockerfile: browser-worker/Dockerfile
    init: true
    environment:
      PORT: 8081
      CHROMIUM_EXECUTABLE: ${CHROMIUM_EXECUTABLE:-/usr/bin/chromium}
      BROWSER_DISPLAY_MODE: ${BROWSER_DISPLAY_MODE:-headless}
      BROWSER_NAVIGATION_TIMEOUT_MS: ${BROWSER_NAVIGATION_TIMEOUT_MS:-45000}
      WORKER_CONTROL_SECRET: ${WORKER_CONTROL_SECRET:?WORKER_CONTROL_SECRET must be set}
      VIEWER_SIGNING_SECRET: ${VIEWER_SIGNING_SECRET:?VIEWER_SIGNING_SECRET must be set}
      VIEWER_TOKEN_TTL_SECONDS: ${VIEWER_TOKEN_TTL_SECONDS:-300}
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-3}
      BROWSER_STATE_MAX_BYTES: ${BROWSER_STATE_MAX_BYTES:-262144}
      WORKER_CONTROL_RATE_LIMIT_PER_MINUTE: ${WORKER_CONTROL_RATE_LIMIT_PER_MINUTE:-600}
      VIEWER_RATE_LIMIT_PER_MINUTE: ${VIEWER_RATE_LIMIT_PER_MINUTE:-1200}
      NODE_ENV: production
    ports:
      - "127.0.0.1:${WORKER_PORT:-18081}:8081"
    networks:
      - browser-runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  browser-runtime:
    driver: bridge

volumes:
  runtime-data:
